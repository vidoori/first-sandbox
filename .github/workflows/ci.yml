name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/vidoori/first-sandbox

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        id: setup-py
        with:
          python-version: "3.14"

      - name: Confirm Python version
        run: echo "Installed Python ${{ steps.setup-py.outputs.python-version }}"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v --junitxml=test-results.xml

      - name: Test summary
        if: always()
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          out = open(os.environ["GITHUB_STEP_SUMMARY"], "a")
          if not os.path.exists("test-results.xml"):
              out.write("## Test results\n\nNo results file - pytest did not run.\n")
              raise SystemExit

          passed = failed = 0
          rows = []
          for tc in ET.parse("test-results.xml").getroot().iter("testcase"):
              problem = tc.find("failure") if tc.find("failure") is not None else tc.find("error")
              if problem is None:
                  passed += 1
                  rows.append(f"| ✅ | `{tc.get('name')}` | |")
              else:
                  failed += 1
                  msg = (problem.get("message") or "").replace("|", "\\|").replace("\n", " ")[:200]
                  rows.append(f"| ❌ | `{tc.get('name')}` | {msg} |")

          out.write(f"## Test results: {passed} passed, {failed} failed\n\n")
          out.write("| | Test | Message |\n|---|---|---|\n")
          out.write("\n".join(rows) + "\n")
          PY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
          retention-days: 90

  build:
    needs: [test, sast-codeql, secrets-gitleaks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # LEARNING NOTE: build-push-action writes its own "Docker Build summary"
      # section to the job summary and uploads a .dockerbuild record artifact.
      # To turn those off, add this to the step:
      #   env:
      #     DOCKER_BUILD_SUMMARY: false
      #     DOCKER_BUILD_RECORD_UPLOAD: false
      - name: Build (and push on main)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Build summary
        run: |
          {
            echo "## Docker build"
            echo ""
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "✅ Pushed \`${{ env.IMAGE }}:${{ github.sha }}\`"
              echo ""
              echo "Digest: \`${{ steps.build.outputs.digest }}\`"
            else
              echo "✅ Built (not pushed - pull request)"
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          cat >> "$GITHUB_STEP_SUMMARY" <<'MD'
          > ℹ️ **Learning note:** The "Docker Build summary" section below is generated automatically by `docker/build-push-action`, not by our workflow. To turn it off, add `DOCKER_BUILD_SUMMARY: false` and `DOCKER_BUILD_RECORD_UPLOAD: false` under `env:` on the build step.
          MD

  sast-codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none
          queries: security-extended

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          output: codeql-results

      - name: Upload CodeQL results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-codeql
          path: codeql-results
          retention-days: 90

      - name: CodeQL summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, json, os
          from collections import Counter

          counts = Counter()
          rows = []
          for f in glob.glob("codeql-results/*.sarif"):
              for run in json.load(open(f))["runs"]:
                  for r in run.get("results", []):
                      level = r.get("level", "warning")
                      counts[level] += 1
                      loc = r["locations"][0]["physicalLocation"]
                      where = f'{loc["artifactLocation"]["uri"]}:{loc.get("region", {}).get("startLine", "?")}'
                      rows.append(f'| {level} | `{r["ruleId"]}` | `{where}` |')

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              total = sum(counts.values())
              icon = "✅" if total == 0 else "⚠️"
              out.write(f"## SAST (CodeQL): {icon} {total} findings\n\n")
              if rows:
                  out.write("| Level | Rule | Location |\n|---|---|---|\n")
                  out.write("\n".join(rows) + "\n")
          PY

      - name: CodeQL gate
        run: |
          python3 - <<'GATE'
          import glob, json
          errors = [r for f in glob.glob("codeql-results/*.sarif")
                      for run in json.load(open(f))["runs"]
                      for r in run.get("results", [])
                      if r.get("level") == "error"]
          if errors:
              print(f"::error::CodeQL found {len(errors)} error-level findings")
              raise SystemExit(1)
          print("No error-level CodeQL findings")
          GATE

  secrets-gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 \
            git /repo \
            --report-format sarif \
            --report-path /repo/gitleaks.sarif \
            --redact \
            --exit-code 1

      - name: Upload Gitleaks results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secrets-gitleaks
          path: gitleaks.sarif
          retention-days: 90

      - name: Gitleaks summary
        if: always()
        run: |
          python3 - <<'PY'
          import json, os

          rows = []
          if os.path.exists("gitleaks.sarif"):
              for run in json.load(open("gitleaks.sarif"))["runs"]:
                  for r in run.get("results", []):
                      loc = r["locations"][0]["physicalLocation"]
                      where = f'{loc["artifactLocation"]["uri"]}:{loc.get("region", {}).get("startLine", "?")}'
                      rows.append(f'| `{r["ruleId"]}` | `{where}` |')

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              if not os.path.exists("gitleaks.sarif"):
                  out.write("## Secrets (Gitleaks): ❌ scan did not produce results\n")
              else:
                  icon = "✅" if not rows else "❌"
                  out.write(f"## Secrets (Gitleaks): {icon} {len(rows)} findings\n\n")
                  if rows:
                      out.write("| Rule | Location |\n|---|---|\n")
                      out.write("\n".join(rows) + "\n")
          PY
